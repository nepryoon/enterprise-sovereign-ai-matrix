title = "Enterprise Sovereign AI secret scanning policy"

[extend]
useDefault = true

[allowlist]
description = "Inert reference syntax and committed environment placeholders"
paths = [
  '''(^|/)BUILD_SPEC\.md$''',
  '''(^|/)docs/reference/''',
  '''(^|/)reference/''',
  '''(^|/)\.env\.example$''',
]
regexes = [
  '''change-me(?:-[a-z0-9-]+)?''',
  '''local-development-key''',
]
