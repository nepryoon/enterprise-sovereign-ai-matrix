[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sovereign-matrix-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.35.0",
  "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.43",
  "psycopg[binary]==3.2.9",
  "langgraph==1.2.10",
  "httpx==0.28.1",
  "langfuse==4.14.3",
]
[project.optional-dependencies]
dev = ["pytest==8.4.1", "pytest-cov==6.2.1", "ruff==0.12.10", "mypy==1.17.1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=80"
markers = ["integration: end-to-end API tests that exercise the application stack"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
