name: sovereign-matrix
x-app-security: &app-security
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  restart: unless-stopped
x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://matrix:${POSTGRES_PASSWORD}@postgres:5432/matrix
  NEXTAUTH_URL: http://langfuse-web:3000
  NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
  SALT: ${LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: default
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  REDIS_CONNECTION_STRING: redis://:${REDIS_PASSWORD}@redis:6379
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
services:
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    <<: *app-security
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_healthy}
    networks: [edge, internal]
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
  api:
    build: {context: ./apps/api}
    <<: *app-security
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      INFERENCE_MODE: ${INFERENCE_MODE:-fake}
      SOVEREIGN_AVAILABLE: ${SOVEREIGN_AVAILABLE:-true}
      OLLAMA_BASE_URL: http://ollama:11434
      LANGFUSE_HOST: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      RUN_LIVE_LLM_TESTS: "false"
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      litellm: {condition: service_healthy}
    networks: [edge, internal]
    healthcheck:
      test: [CMD-SHELL, "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')\""]
      interval: 15s
      timeout: 5s
      retries: 10
  postgres:
    image: postgres:16.9-alpine
    restart: unless-stopped
    environment: {POSTGRES_USER: "${POSTGRES_USER}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: "${POSTGRES_DB}"}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"], interval: 10s, timeout: 5s, retries: 10}
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.96.0-stable
    restart: unless-stopped
    command: [--config, /app/config.yaml, --port, "4000"]
    environment: {LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY}", OPENAI_API_KEY: "${OPENAI_API_KEY:-}", OLLAMA_BASE_URL: "http://ollama:11434"}
    volumes: [./config/litellm/config.yaml:/app/config.yaml:ro]
    depends_on: {ollama: {condition: service_healthy}}
    networks: [internal]
    healthcheck: {test: [CMD-SHELL, "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\""], interval: 15s, timeout: 5s, retries: 12}
  ollama:
    image: ollama/ollama:0.11.4
    restart: unless-stopped
    volumes: [ollama-data:/root/.ollama]
    networks: [internal]
    healthcheck: {test: [CMD, ollama, list], interval: 15s, timeout: 10s, retries: 10}
  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse-web:4
    restart: unless-stopped
    environment: *langfuse-env
    depends_on: {postgres: {condition: service_healthy}, clickhouse: {condition: service_healthy}, redis: {condition: service_healthy}, minio: {condition: service_healthy}}
    ports: ["127.0.0.1:3001:3000"]
    networks: [internal]
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    restart: unless-stopped
    environment: *langfuse-env
    depends_on: {postgres: {condition: service_healthy}, clickhouse: {condition: service_healthy}, redis: {condition: service_healthy}, minio: {condition: service_healthy}}
    networks: [internal]
  clickhouse:
    image: clickhouse/clickhouse-server:26.4-alpine
    restart: unless-stopped
    environment: {CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"}
    volumes: [clickhouse-data:/var/lib/clickhouse]
    networks: [internal]
    healthcheck: {test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"], interval: 10s, timeout: 5s, retries: 10}
  redis:
    image: redis:7.4.5-alpine
    restart: unless-stopped
    command: [sh, -c, 'exec redis-server --requirepass "$${REDIS_PASSWORD}"']
    environment: {REDIS_PASSWORD: "${REDIS_PASSWORD}"}
    volumes: [redis-data:/data]
    networks: [internal]
    healthcheck: {test: [CMD-SHELL, 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG'], interval: 10s, timeout: 5s, retries: 10}
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment: {MINIO_ROOT_USER: "${MINIO_ROOT_USER}", MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"}
    volumes: [minio-data:/data]
    networks: [internal]
    healthcheck: {test: [CMD, mc, ready, local], interval: 10s, timeout: 5s, retries: 10}
  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: {web: {condition: service_healthy}}
    networks: [edge]
networks:
  edge: {}
  internal: {internal: true}
volumes:
  postgres-data: {}
  ollama-data: {}
  clickhouse-data: {}
  redis-data: {}
  minio-data: {}
