name: Integration CI
on:
  pull_request: {paths: ['apps/**', 'tests/**', 'docker-compose*.yml']}
  workflow_dispatch:
permissions: {contents: read}
jobs:
  integration:
    runs-on: ubuntu-latest
    env: {RUN_LIVE_LLM_TESTS: 'false', DATABASE_URL: 'sqlite+aiosqlite:///./integration.db'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip, cache-dependency-path: apps/api/pyproject.toml}
      - run: python -m pip install -e './apps/api[dev]'
      - run: cd apps/api && pytest -m integration
