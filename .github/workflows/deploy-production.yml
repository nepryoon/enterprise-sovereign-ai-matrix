name: Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sovereign-matrix-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate production candidate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install backend
        run: python -m pip install -e './apps/api[dev]'

      - name: Backend lint
        run: cd apps/api && ruff check .

      - name: Backend typecheck
        run: |
          cd apps/api
          mypy \
            app/domain.py \
            app/routing \
            app/services/cost.py \
            app/api/schemas.py

      - name: Backend tests
        run: |
          cd apps/api
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc

      - name: Install frontend
        run: cd apps/web && npm ci --no-audit --no-fund

      - name: Frontend lint
        run: cd apps/web && npm run lint

      - name: Frontend typecheck
        run: cd apps/web && npm run typecheck

      - name: Frontend tests
        run: cd apps/web && npm test

      - name: Frontend build
        run: cd apps/web && npm run build

      - name: Integration tests
        env:
          RUN_LIVE_LLM_TESTS: "false"
        run: |
          cd apps/api
          pytest tests/test_api.py tests/test_persistence.py

      - name: Scan repository for secrets
        run: python scripts/scan-secrets.py

      - name: Prepare CI environment
        run: cp .env.example .env

      - name: Validate production Compose
        run: |
          docker compose \
            --env-file .env \
            -f docker-compose.yml \
            -f docker-compose.production.yml \
            --profile tunnel \
            config --quiet

      - name: Build application containers
        run: |
          docker compose \
            --env-file .env \
            -f docker-compose.yml \
            -f docker-compose.production.yml \
            build api web

  deploy:
    name: Start production deploy
    needs: validate

    runs-on:
      - self-hosted
      - Linux
      - X64
      - matrix-prod

    environment:
      name: production
      url: https://matrix.neuromorphicinference.com

    steps:
      - name: Start exact-commit deploy outside the runner lifecycle
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          status_file="/tmp/sovereign-matrix-deploy-${DEPLOY_SHA}.status"
          log_file="/tmp/sovereign-matrix-deploy-${DEPLOY_SHA}.log"
          rm -f "$status_file" "$log_file"

          # Deploying the stack can restart the self-hosted runner. Detach the
          # deploy process from Actions process tracking so that it can finish.
          RUNNER_TRACKING_ID="" nohup setsid bash -c '
            sudo -n /usr/local/sbin/deploy-sovereign-matrix "$1"
            result=$?
            printf "%s\n" "$result" >"$2"
            exit "$result"
          ' -- "$DEPLOY_SHA" "$status_file" >"$log_file" 2>&1 </dev/null &

          deploy_pid=$!
          sleep 5
          if ! kill -0 "$deploy_pid" 2>/dev/null && [[ ! -f "$status_file" ]]; then
            echo "Deploy process exited before recording a result" >&2
            cat "$log_file" >&2
            exit 1
          fi

  smoke-production:
    name: Smoke-test production
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout smoke test
        uses: actions/checkout@v4

      - name: Wait for rollout and verify public application workflow
        run: |
          # The deployment can temporarily restart the only self-hosted runner,
          # so verification must not require that runner to come back online.
          sleep 90
          for attempt in {1..48}; do
            if ./scripts/demo-smoke-test.sh https://matrix.neuromorphicinference.com; then
              exit 0
            fi
            echo "Public smoke test not ready ($attempt/48); retrying in 30 seconds"
            sleep 30
          done
          echo "Production did not pass the public smoke test within 25 minutes" >&2
          exit 1
