name: Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sovereign-matrix-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate production candidate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install backend
        run: python -m pip install -e './apps/api[dev]'

      - name: Backend lint
        run: cd apps/api && ruff check .

      - name: Backend typecheck
        run: |
          cd apps/api
          mypy \
            app/domain.py \
            app/routing \
            app/services/cost.py \
            app/api/schemas.py

      - name: Backend tests
        run: |
          cd apps/api
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc

      - name: Install frontend
        run: cd apps/web && npm ci --no-audit --no-fund

      - name: Frontend lint
        run: cd apps/web && npm run lint

      - name: Frontend typecheck
        run: cd apps/web && npm run typecheck

      - name: Frontend tests
        run: cd apps/web && npm test

      - name: Frontend build
        run: cd apps/web && npm run build

      - name: Integration tests
        env:
          RUN_LIVE_LLM_TESTS: "false"
        run: |
          cd apps/api
          pytest tests/test_api.py tests/test_persistence.py

      - name: Scan repository for secrets
        run: python scripts/scan-secrets.py

      - name: Prepare CI environment
        run: cp .env.example .env

      - name: Validate production Compose
        run: |
          docker compose \
            --env-file .env \
            -f docker-compose.yml \
            -f docker-compose.production.yml \
            --profile tunnel \
            config --quiet

      - name: Build application containers
        run: |
          docker compose \
            --env-file .env \
            -f docker-compose.yml \
            -f docker-compose.production.yml \
            build api web

  deploy:
    name: Start production deploy
    needs: validate

    runs-on:
      - self-hosted
      - Linux
      - X64
      - matrix-prod

    environment:
      name: production
      url: https://matrix.neuromorphicinference.com

    steps:
      - name: Deploy exact commit
        run: |
          sudo -n /usr/local/sbin/deploy-sovereign-matrix \
            "${{ github.sha }}"

  smoke-production:
    name: Smoke-test production
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout smoke test
        uses: actions/checkout@v4

      - name: Wait for rollout and verify public application workflow
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          [[ -n "$CF_ACCESS_CLIENT_ID" && -n "$CF_ACCESS_CLIENT_SECRET" ]] || {
            echo "Cloudflare Access service-token secrets are not configured" >&2
            exit 1
          }
          # The deployment can temporarily restart the only self-hosted runner,
          # so verification must not require that runner to come back online.
          sleep 90
          for attempt in {1..48}; do
            if ./scripts/demo-smoke-test.sh https://matrix.neuromorphicinference.com; then
              exit 0
            fi
            echo "Public smoke test not ready ($attempt/48); retrying in 30 seconds"
            sleep 30
          done
          echo "Production did not pass the public smoke test within 25 minutes" >&2
          exit 1
