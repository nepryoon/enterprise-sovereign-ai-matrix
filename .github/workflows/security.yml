name: Security
on:
  pull_request:
  schedule: [{cron: '23 4 * * 1'}]
  workflow_dispatch:
permissions: {contents: read, security-events: write}
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install pip-audit && pip install -e './apps/api'
      - run: pip check
      - name: Produce Python vulnerability report
        run: pip-audit --format=json --output=pip-audit.json || true
      - uses: actions/setup-node@v4
        with: {node-version-file: apps/web/.nvmrc}
      - run: cd apps/web && npm install --no-audit --no-fund
      # High-severity advisories are reviewed in the scheduled report; only critical
      # vulnerabilities block this low-cost PoC until a lockfile is generated in connected CI.
      - run: cd apps/web && npm audit --audit-level=critical
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: pip-audit.json
          if-no-files-found: ignore
